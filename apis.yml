aid: radical-ventures
name: Radical Ventures
description: Radical Ventures is a venture capital firm investing exclusively in AI-first companies, backing founders applying artificial intelligence across foundation models, AI infrastructure and compute, enterprise agents, robotics, scientific discovery, life sciences, climate and space. The firm operates from Toronto, San Francisco and London, runs the Velocity program and publishes AI Perspectives; its portfolio of 59 companies includes Cohere, Writer, World Labs, Twelve Labs, Hebbia, Cyera, Crusoe and You.com.
